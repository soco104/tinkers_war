function drawPipe(g, x1, y1, x2, y2, thick = 8) {
  const horiz = y1 === y2;
  g.lineStyle(thick, C.copper, 1).lineBetween(x1, y1, x2, y2);
  g.lineStyle(thick * 0.35, C.copperLight, 1);
  if (horiz) g.lineBetween(x1, y1 - thick * 0.2, x2, y2 - thick * 0.2);
  else g.lineBetween(x1 - thick * 0.2, y1, x2 - thick * 0.2, y2);
  g.fillStyle(C.brass, 1);
  const len = horiz ? x2 - x1 : y2 - y1;
  for (let d = 30; d < len; d += 70) {
    if (horiz) g.fillRect(x1 + d - 3, y1 - thick * 0.8, 6, thick * 1.6);
    else g.fillRect(x1 - thick * 0.8, y1 + d - 3, thick * 1.6, 6);
  }
}

function drawGauge(g, x, y) {
  g.fillStyle(C.brass, 1).fillCircle(x, y, 8);
  g.fillStyle(0xf2e6c9, 1).fillCircle(x, y, 5.5);
  g.lineStyle(1.5, 0xb03020, 1).lineBetween(x, y, x + 3.5, y - 3);
  g.fillStyle(0x222222, 1).fillCircle(x, y, 1);
}

// Toothed cog: polygon teeth around a disc with a hub hole
function drawCog(g, x, y, r, teeth, color = C.brass, hole = 0x1a110b) {
  g.fillStyle(color, 1);
  const w = Math.PI / teeth * 0.55;
  for (let i = 0; i < teeth; i++) {
    const a = (i / teeth) * Math.PI * 2;
    g.fillPoints([
      { x: x + Math.cos(a - w) * r * 0.9, y: y + Math.sin(a - w) * r * 0.9 },
      { x: x + Math.cos(a - w * 0.6) * r * 1.22, y: y + Math.sin(a - w * 0.6) * r * 1.22 },
      { x: x + Math.cos(a + w * 0.6) * r * 1.22, y: y + Math.sin(a + w * 0.6) * r * 1.22 },
      { x: x + Math.cos(a + w) * r * 0.9, y: y + Math.sin(a + w) * r * 0.9 },
    ], true);
  }
  g.fillCircle(x, y, r);
  g.lineStyle(1, 0x000000, 0.25).strokeCircle(x, y, r * 0.68);
  g.fillStyle(hole, 1).fillCircle(x, y, r * 0.3);
}

function drawSpring(g, x, y, len, rad, vertical = true, color = 0x9aa3a8) {
  g.lineStyle(2, color, 1);
  const coils = Math.max(3, Math.round(len / 5));
  for (let i = 0; i < coils; i++) {
    const t = (i / (coils - 1)) * len;
    if (vertical) g.strokeEllipse(x, y + t, rad * 2, 5);
    else g.strokeEllipse(x + t, y, 5, rad * 2);
  }
}

// Wrench hanging head-up from a nail
function drawHangingWrench(g, x, y, len, wallColor) {
  g.fillStyle(0x1a110b, 1).fillCircle(x, y - 2, 1.5);                    // nail
  g.fillStyle(0x8a939a, 1).fillRect(x - 2, y + 4, 4, len);
  g.fillCircle(x, y + 4, 6).fillCircle(x, y + len + 2, 4);
  g.fillStyle(wallColor, 1).fillRect(x - 2, y - 3, 4, 6);                // open jaw
}

function drawPiston(g, x, y, len, vertical = false) {
  if (vertical) {
    g.fillStyle(0xb8c0c4, 1).fillRect(x - 2, y, 4, len * 0.5);
    g.fillStyle(C.brass, 1).fillRoundedRect(x - 7, y + len * 0.45, 14, len * 0.55, 3);
    g.fillStyle(C.brassDark, 1).fillRect(x - 7, y + len * 0.45, 14, 3);
  } else {
    g.fillStyle(0xb8c0c4, 1).fillRect(x + len * 0.5, y - 2, len * 0.5, 4);
    g.fillStyle(C.brass, 1).fillRoundedRect(x, y - 7, len * 0.55, 14, 3);
    g.fillStyle(C.brassDark, 1).fillRect(x + len * 0.55 - 3, y - 7, 3, 14);
  }
}

// A heap of mechanical junk: cogs, springs, pipe offcuts, plates, nuts, pistons.
// Seeded so every pile looks hand-placed but stays the same each time.
function drawJunkPile(g, cx, baseY, width, height, count, seed) {
  const rng = new Phaser.Math.RandomDataGenerator([String(seed)]);
  const metals = [C.brass, C.copper, 0x7a6a4a, C.brassDark, 0x6a6f72, 0x8a939a, 0x5a4a3a];

  // Shadow and dark heap underneath
  g.fillStyle(0x000000, 0.35).fillEllipse(cx, baseY + 2, width * 1.1, 14);
  g.fillStyle(0x241a12, 1).fillTriangle(cx - width / 2, baseY, cx + width / 2, baseY, cx, baseY - height * 0.8);
  g.fillEllipse(cx, baseY - 4, width, height * 0.5);

  // Pick positions inside a triangular mound, draw back (high) to front (low)
  const items = [];
  for (let i = 0; i < count; i++) {
    const up = Math.pow(rng.frac(), 1.4) * height;
    const half = (width / 2) * (1 - up / height) + 4;
    items.push({ x: cx + (rng.frac() * 2 - 1) * half, y: baseY - up - 4, kind: rng.between(0, 9), col: rng.pick(metals), s: rng.frac() });
  }
  items.sort((a, b) => a.y - b.y);

  for (const it of items) {
    const { x, y, col, s } = it;
    switch (it.kind) {
      case 0: case 1: case 2:                                    // cogs (most common)
        drawCog(g, x, y, 4 + s * 9, 6 + Math.round(s * 5), col);
        break;
      case 3:                                                    // spring
        drawSpring(g, x - 8, y, 16, 4 + s * 2, false, s > 0.5 ? 0x9aa3a8 : C.copperLight);
        break;
      case 4:                                                    // pipe offcut
        drawPipe(g, x - 10 - s * 8, y, x + 10 + s * 8, y, 5);
        break;
      case 5: {                                                  // bent metal plate
        const a = s * Math.PI, w = 10 + s * 8, h = 6 + s * 4;
        const pts = [[-w, -h], [w, -h], [w, h], [-w, h]].map(([px, py]) => ({
          x: x + px * Math.cos(a) - py * Math.sin(a), y: y + px * Math.sin(a) + py * Math.cos(a),
        }));
        g.fillStyle(col === C.brass ? 0x6a6f72 : col, 1).fillPoints(pts, true);
        g.fillStyle(0x1a110b, 1).fillCircle(pts[0].x * 0.8 + x * 0.2, pts[0].y * 0.8 + y * 0.2, 1.2);
        break;
      }
      case 6: {                                                  // hex nut
        const r = 3 + s * 3;
        const pts = [];
        for (let k = 0; k < 6; k++) pts.push({ x: x + Math.cos(k * Math.PI / 3) * r, y: y + Math.sin(k * Math.PI / 3) * r });
        g.fillStyle(0x8a939a, 1).fillPoints(pts, true);
        g.fillStyle(0x1a110b, 1).fillCircle(x, y, r * 0.45);
        break;
      }
      case 7:                                                    // piston
        drawPiston(g, x - 12, y, 24 + s * 10);
        break;
      case 8:                                                    // old gauge
        drawGauge(g, x, y);
        break;
      default:                                                   // dented can / canister
        g.fillStyle(col, 1).fillRoundedRect(x - 5, y - 7, 10 + s * 4, 13, 2);
        g.fillStyle(0x000000, 0.3).fillRect(x - 5, y - 7, 10 + s * 4, 2);
    }
  }
}

// Cute chibi character: big head, small body. `o` customises colours and extras.
function drawChibi(g, o) {
  const skin = o.skin ?? 0xf6cfa8;
  g.fillStyle(0x000000, 0.35).fillEllipse(24, 54, 30, 8);                       // shadow
  g.fillStyle(o.boots, 1).fillRoundedRect(15, 47, 8, 7, 2).fillRoundedRect(25, 47, 8, 7, 2);
  g.fillStyle(o.outfit, 1).fillRoundedRect(12, 32, 24, 19, 7);                  // body
  g.fillCircle(11, 39, 4.5).fillCircle(37, 39, 4.5);                            // sleeves
  g.fillStyle(skin, 1).fillCircle(10, 44, 3.2).fillCircle(38, 44, 3.2);         // hands
  if (o.body) o.body(g);
  g.fillStyle(o.hair, 1).fillCircle(24, 21, 17);                                // hair (back)
  if (o.longHair) g.fillRoundedRect(7, 18, 34, 22, 9);
  if (o.pigtails) g.fillCircle(6, 27, 5).fillCircle(42, 27, 5);
  g.fillStyle(skin, 1).fillEllipse(24, 25, 28, 22);                             // face
  g.fillStyle(o.hair, 1).fillEllipse(24, 13, 30, 12);                           // bangs
  g.fillStyle(0x2b1d14, 1).fillEllipse(18, 26, 5, 6.5).fillEllipse(30, 26, 5, 6.5); // eyes
  g.fillStyle(0xffffff, 1).fillCircle(19, 24.5, 1.4).fillCircle(31, 24.5, 1.4);
  g.fillStyle(0xff8f8f, 0.6).fillEllipse(14, 30, 5, 3).fillEllipse(34, 30, 5, 3); // blush
  g.fillStyle(0x7a3b2e, 1).fillRect(22.5, 31, 3, 1.5);                          // mouth
  if (o.head) o.head(g);
}

      const g = this.make.graphics({ x: 0, y: 0 }, false);
      draw(g);
      g.generateTexture(key, w, h);

    for (const [key, opts] of Object.entries(CHARACTERS)) {

    // Wrench (pivot at the left end of the handle)

      g.fillStyle(0x2f2620, 1).fillRect(1, 1, 38, 2).fillRect(1, 1, 2, 38);
      g.fillStyle(0x110d0a, 1).fillRect(1, 37, 38, 2).fillRect(37, 1, 2, 38);
      for (const [x, y] of [[6, 6], [34, 6], [6, 34], [34, 34]]) {
        g.fillStyle(0x4d3d2c, 1).fillCircle(x, y, 2.2);

      g.fillStyle(C.brassLight, 1).fillRect(6, 18, 48, 5);

      g.fillStyle(0x5a3e18, 1).fillRoundedRect(14, 34, 32, 30, 4);
      g.fillStyle(0x1a0e08, 1).fillRect(18, 38, 24, 22);
    });

    // Flame
    make('flame', 24, 32, (g) => {
      g.fillStyle(0xff5a00, 1).fillEllipse(12, 22, 20, 18).fillTriangle(3, 20, 21, 20, 12, 1);
      g.fillStyle(0xffa600, 1).fillEllipse(12, 24, 13, 12).fillTriangle(6, 23, 18, 23, 12, 8);
      g.fillStyle(0xfff0a0, 1).fillEllipse(12, 26, 6, 7);
    });

    // Prologue props
    make('cog', 40, 40, (g) => drawCog(g, 20, 20, 15, 10, 0xffffff, 0x1a110b));
    make('knife', 20, 6, (g) => {
      g.fillStyle(0x5e3719, 1).fillRoundedRect(0, 1, 7, 4, 1);
      g.fillStyle(0xd0d6da, 1).fillRect(7, 1.5, 9, 3).fillTriangle(16, 1.5, 20, 3, 16, 4.5);
    });
    make('bowler', 36, 16, (g) => {
      g.fillStyle(0x1a1a1a, 1).fillEllipse(18, 7, 24, 14).fillEllipse(18, 12, 36, 7);
      g.fillStyle(0x5a2a2a, 1).fillRect(6, 9, 24, 2);
    });
    make('cup', 14, 12, (g) => {
      g.fillStyle(0xe8dcc0, 1).fillRoundedRect(1, 3, 8, 8, 2);
      g.lineStyle(1.5, 0xe8dcc0, 1).strokeCircle(10.5, 7, 2.2);
      g.fillStyle(0x7a4a24, 1).fillRect(2, 4, 6, 2);
    });

    // Soft radial textures (glow, steam, vignette) via canvas gradients
    const radial = (key, w, h, stops, inner = 0) => {
      const tex = this.textures.createCanvas(key, w, h);
      const ctx = tex.getContext();
      const grad = ctx.createRadialGradient(w / 2, h / 2, inner, w / 2, h / 2, Math.max(w, h) / 2);
      for (const [pos, col] of stops) grad.addColorStop(pos, col);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
      tex.refresh();
    };
    radial('glow', 128, 128, [[0, 'rgba(255,255,255,1)'], [0.4, 'rgba(255,255,255,0.4)'], [1, 'rgba(255,255,255,0)']]);
    radial('puff', 64, 64, [[0, 'rgba(255,255,255,0.8)'], [1, 'rgba(255,255,255,0)']]);
    radial('vignette', WIDTH, HEIGHT, [[0, 'rgba(0,0,0,0)'], [0.5, 'rgba(0,0,0,0)'], [1, 'rgba(8,4,2,0.7)']], 0);

    // Health bar art (embedded PNGs): slice each sheet into its 6 frames once loaded
    let pending = 2;
    const onAdd = (key) => {
      if (key !== 'hpbar_full' && key !== 'hpbar_empty') return;
      const tex = this.textures.get(key);
      for (let i = 0; i < HPBAR_FRAME.count; i++) {
        tex.add(i, 0, 0, i * HPBAR_FRAME.stride, HPBAR_FRAME.w, HPBAR_FRAME.h);
      }
      tex.setFilter(Phaser.Textures.FilterMode.NEAREST); // keep the pixel art crisp
      if (--pending === 0) {
        this.textures.off('addtexture', onAdd);
        this.startGame();
      }
    };
    this.textures.on('addtexture', onAdd);
    this.textures.addBase64('hpbar_full', HPBAR_FULL_PNG);
    this.textures.addBase64('hpbar_empty', HPBAR_EMPTY_PNG);
  }

  startGame() {
    this.scene.start('Prologue');
  }
}

// UI layers sit far above the scenery, whose depth follows y-position.
const DEPTH_BLACKOUT = 5000;
const DEPTH_UI = 6000;

class DialogueBox {
  constructor(scene) {
    this.scene = scene;
    this.typing = false;
    const boxY = 470;
    const frame = scene.add.rectangle(WIDTH / 2, boxY + 70, WIDTH - 60, 140, 0x140e0a, 0.94)
      .setStrokeStyle(3, 0xb5893a).setDepth(DEPTH_UI);
    const inner = scene.add.rectangle(WIDTH / 2, boxY + 70, WIDTH - 72, 128)
      .setStrokeStyle(1, 0x6e5020).setDepth(DEPTH_UI);
    this.name = scene.add.text(50, boxY + 12, '', {
      fontFamily: 'monospace', fontSize: '18px', fontStyle: 'bold', color: '#ffffff',
    }).setDepth(DEPTH_UI + 1);
    this.body = scene.add.text(50, boxY + 42, '', {
      fontFamily: 'monospace', fontSize: '18px', color: '#f0e2c8',
      wordWrap: { width: WIDTH - 110 }, lineSpacing: 6,
    }).setDepth(DEPTH_UI + 1);
    this.hint = scene.add.text(WIDTH - 46, boxY + 120, 'SPACE ▶', {
      fontFamily: 'monospace', fontSize: '13px', color: '#c9a227',
    }).setOrigin(1, 0.5).setDepth(DEPTH_UI + 1);
    scene.tweens.add({ targets: this.hint, alpha: 0.3, duration: 500, yoyo: true, repeat: -1 });
    this.parts = [frame, inner, this.name, this.body, this.hint];
  }

  setVisible(v) { this.parts.forEach((p) => p.setVisible(v)); return this; }
  setHintVisible(v) { this.hint.setVisible(v); return this; }

  show(speaker, text) {
    if (speaker) {
      this.name.setText(speaker).setColor(SPEAKER_COLORS[speaker] || '#ffffff');
      this.body.setFontStyle('normal').setColor('#f0e2c8');
    } else {
      this.name.setText('');
      this.body.setFontStyle('italic').setColor('#c2b293');
    }
    this.fullText = text;
    this.body.setText('');
    this.typing = true;
    let i = 0;
    this.typeEvent = this.scene.time.addEvent({
      delay: 22,
      repeat: text.length - 1,
      callback: () => {
        i++;
        this.body.setText(text.slice(0, i));
        if (i >= text.length) this.typing = false;
      },
    });
  }

  // Completes the current line if it is still typing. Returns true if it was.
  finish() {
    if (!this.typing) return false;
    this.typeEvent.remove();
    this.body.setText(this.fullText);
    this.typing = false;
    return true;
  }
}

class PrologueScene extends Phaser.Scene {
  constructor() { super('Prologue'); }

  create() {
    this.leaving = false;
    this.stepIndex = -1;
    this.busy = false;

    this.drawHome();

    const actor = (key, x, y, scale = 2) =>
      this.add.image(x, y, key).setOrigin(0.5, FEET_Y / CHAR_H).setScale(scale);
    this.papa = actor('papa', 170, 420);
    this.ren = actor('ren', 350, 410);
    this.kid = actor('tinker_kid', 255, 448, 1.3);
    this.voss = actor('collector', 1020, 390);
    this.guardA = actor('guard', 1020, 400);
    this.guardB = actor('guard', 1060, 420);
    this.actors = [this.papa, this.ren, this.kid, this.voss, this.guardA, this.guardB];
    this.knife = this.add.image(545, 378, 'knife').setDepth(401);
    this.cup = this.add.image(424, 281, 'cup').setDepth(331).setScale(1.4);

    this.blackout = this.add.rectangle(WIDTH / 2, HEIGHT / 2, WIDTH, HEIGHT, 0x000000).setDepth(DEPTH_BLACKOUT);
    this.centerText = this.add.text(WIDTH / 2, HEIGHT / 2 - 30, '', {
      fontFamily: 'monospace', fontSize: '30px', color: '#e2bd55', align: 'center',
    }).setOrigin(0.5).setDepth(DEPTH_UI).setAlpha(0);
    this.box = new DialogueBox(this).setVisible(false);
    this.add.text(WIDTH - 30, 44, 'ESC: skip prologue', {
      fontFamily: 'monospace', fontSize: '12px', color: '#a8916a',
      backgroundColor: '#140e0acc', padding: { x: 5, y: 3 },
    }).setOrigin(1, 0).setDepth(DEPTH_UI + 1);

    this.steps = this.buildSteps();
    this.input.keyboard.on('keydown-SPACE', () => this.advance());
    this.input.keyboard.on('keydown-ESC', () => this.toStory());
    this.next();
  }

  update() {
    for (const a of this.actors) a.setDepth(a.y);
  }

  // --- Step runner -----------------------------------------------------------
  // Each step: { speaker, text } for dialogue, { center } for a title card,
  // run() for animation lasting `ms`, and auto: true to continue without Space.

  advance() {
    if (this.leaving || this.busy) return;
    if (this.box.finish()) return;
    this.next();
  }

  next() {
    this.stepIndex++;
    if (this.stepIndex >= this.steps.length) return this.toStory();
    const s = this.steps[this.stepIndex];

    if (s.center) {
      this.box.setVisible(false);
      this.centerText.setText(s.center).setAlpha(0);
      this.tweens.add({ targets: this.centerText, alpha: 1, duration: 900 });
    } else {
      this.centerText.setAlpha(0);
      if (s.text) {
        this.box.setVisible(true);
        this.box.show(s.speaker, s.text);
      } else {
        this.box.setVisible(false);
      }
    }

    if (s.run) s.run();
    const ms = Math.max(s.ms || 0, s.center ? 900 : 0);
    this.busy = true;
    this.box.setHintVisible(false);
    this.time.delayedCall(ms, () => {
      this.busy = false;
      this.box.setHintVisible(true);
      if (s.auto) this.next();
    });
  }

  toStory() {
    if (this.leaving) return;
    this.leaving = true;
    this.cameras.main.fadeOut(600, 0, 0, 0);
    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('Story'));
  }

  // --- Animation helpers -----------------------------------------------------

  walk(a, x, y, ms, delay = 0) {
    this.time.delayedCall(delay, () => {
      if (x !== a.x) a.setFlipX(x < a.x);
      this.tweens.add({ targets: a, x, y, duration: ms });
      this.tweens.add({
        targets: a, angle: { from: -5, to: 5 }, duration: 130, yoyo: true,
        repeat: Math.max(0, Math.floor(ms / 260) - 1), onComplete: () => a.setAngle(0),
      });
    });
  }

  hop(a, times = 2) {
    this.tweens.add({ targets: a, y: a.y - 12, duration: 120, yoyo: true, repeat: times - 1, ease: 'Quad.easeOut' });
  }

  shake(a, dist, times, ms = 50) {
    this.tweens.add({ targets: a, x: a.x + dist, duration: ms, yoyo: true, repeat: times - 1 });
  }

  fadeFromBlack(ms) { this.tweens.add({ targets: this.blackout, alpha: 0, duration: ms }); }
  fadeToBlack(ms) { this.tweens.add({ targets: this.blackout, alpha: 1, duration: ms }); }

  // --- The script ------------------------------------------------------------

  buildSteps() {
    return [
      { run: () => this.fadeFromBlack(1200), ms: 1200,
        text: "The Lower Wards, long ago. A tinker's home, crammed with gears, springs and three people." },
      { run: () => this.hop(this.kid), ms: 300,
        speaker: 'Papa', text: 'Almost there, Tink. One more gear and your music box will sing again.' },
      { run: () => this.hop(this.kid, 3), ms: 400,
        speaker: 'Tinker', text: 'Sing, music box! Sing!' },
      { speaker: 'Ren', text: "Papa, she should be in bed. And supper's nearly ready." },
      { run: () => { this.shake(this.door, 3, 6); this.cameras.main.shake(500, 0.004); }, ms: 600,
        text: 'KNOCK. KNOCK. KNOCK.' },
      { run: () => {
          this.door.setFillStyle(0x07080e);
          this.doorKnob.setVisible(false);
          this.walk(this.voss, 760, 390, 1100);
          this.walk(this.guardA, 850, 400, 1000, 250);
          this.walk(this.guardB, 905, 422, 1000, 450);
        }, ms: 1450,
        speaker: 'Collector Voss', text: "Good evening! Collector Voss, Ministry of Heat. It's tax night, I'm afraid." },
      { run: () => { this.walk(this.guardA, 1020, 400, 700); this.walk(this.guardB, 1060, 422, 700); }, ms: 700,
        speaker: 'Collector Voss', text: 'Wait outside, boys. This is a friendly visit.' },
      { run: () => this.walk(this.voss, 480, 390, 1300), ms: 1300,
        speaker: 'Collector Voss', text: 'Coal tax. Chimney tax. Gear tax. And a little something for my trouble.' },
      { speaker: 'Papa', text: 'We paid last month. We barely have enough for—' },
      { speaker: 'Collector Voss', text: 'Then fetch what you barely have.' },
      { run: () => this.walk(this.papa, -60, 420, 1500), ms: 1500,
        speaker: 'Papa', text: "...Ren, get the collector some tea. I'll find the money." },
      // Ren makes the tea in the kitchen corner
      { run: () => {
          this.ren.setFlipX(false);
          this.walk(this.ren, 415, 405, 600);
          this.time.delayedCall(700, () => {
            this.kettleSteam.explode(14);
            this.tweens.add({ targets: this.kettle, x: 370, duration: 40, yoyo: true, repeat: 7 });
          });
          this.time.delayedCall(1300, () => {
            this.cup.setDepth(1000);
            this.tweens.add({ targets: this.cup, x: 434, y: 392, duration: 300 });
          });
        }, ms: 1700,
        text: 'The kettle whistles. Ren pours the tea with shaking hands.' },
      { run: () => {
          this.walk(this.ren, 575, 410, 1200);
          this.tweens.add({ targets: this.cup, x: 520, y: 374, duration: 1200 });
          this.time.delayedCall(1200, () => this.cup.setDepth(402));
        }, ms: 1200,
        speaker: 'Ren', text: '...Your tea, sir.' },
      { run: () => {
          this.tweens.add({ targets: this.voss, x: 505, duration: 200 });
          this.tweens.add({ targets: this.ren, x: 555, duration: 200 });

class StoryScene extends Phaser.Scene {
  constructor() { super('Story'); }

  create() {
    this.index = -1;
    this.currentBg = null;
    this.typing = false;
    this.leaving = false;
    this.bgObjects = [];
    this.box = new DialogueBox(this);
    this.cameras.main.fadeIn(500, 0, 0, 0);
    this.add.text(WIDTH - 30, 20, 'ESC: skip story', {
      fontFamily: 'monospace', fontSize: '12px', color: '#8a7a5e',
    }).setOrigin(1, 0).setDepth(101);

    this.input.keyboard.on('keydown-SPACE', () => this.advance());
    this.input.keyboard.on('keydown-ESC', () => this.startMission());

    this.advance();
  }

  advance() {
    if (this.leaving) return;
    // First press while text is typing just finishes the line
    if (this.box.finish()) return;

    this.index++;
    if (this.index >= STORY.length) return this.startMission();

    const line = STORY[this.index];
    if (line.bg !== this.currentBg) this.drawBackdrop(line.bg);
    this.box.show(line.speaker, line.text);
  }

  startMission() {
    if (this.leaving) return;
    this.leaving = true;
    this.cameras.main.fadeOut(500, 0, 0, 0);
    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('Factory'));
  }

  // Backdrop illustrations for each part of the story
  drawBackdrop(key) {
    this.currentBg = key;
    this.tweens.killTweensOf(this.bgObjects);
    this.bgObjects.forEach((o) => o.destroy());
    this.bgObjects = [];
    const keep = (o) => { this.bgObjects.push(o); return o; };
    const g = keep(this.add.graphics());
    const person = (texKey, x, y, scale = 2) =>
      keep(this.add.image(x, y, texKey).setOrigin(0.5, FEET_Y / CHAR_H).setScale(scale).setDepth(y));
    const furnace = (x, baseY, scale) => {
      keep(this.add.image(x, baseY - 25 * scale, 'glow').setTint(C.fire).setBlendMode('ADD').setScale(1.6 * scale).setAlpha(0.5));
      keep(this.add.image(x, baseY, 'furnace').setOrigin(0.5, 1).setScale(scale));
      const flame = keep(this.add.image(x, baseY - 10 * scale, 'flame').setOrigin(0.5, 1).setScale(0.75 * scale));
      this.tweens.add({ targets: flame, scaleY: 0.6 * scale, alpha: 0.8, duration: 120 + Math.random() * 80, yoyo: true, repeat: -1 });
    };

    if (key === 'day' || key === 'accident') {
      g.fillStyle(0x1d1612, 1).fillRect(0, 0, WIDTH, HEIGHT);
      g.fillStyle(0x2a201a, 1).fillRect(0, 0, WIDTH, 300);
      drawPipe(g, 0, 60, WIDTH, 60, 12);
      drawPipe(g, 0, 100, WIDTH, 100, 8);
      drawGauge(g, 650, 80);
      keep(this.add.tileSprite(0, 300, WIDTH, 180, 'plate').setOrigin(0));
      for (const fx of [110, 290, 780]) furnace(fx, 300, 1.6);

      // The broken press on line three (drawn above the floor)
      const slammed = key === 'accident';
      const pg = keep(this.add.graphics());
      pg.fillStyle(C.brassDark, 1).fillRect(470, 160, 140, 20);
      pg.fillStyle(C.copper, 1).fillRect(480, 180, 20, 230).fillRect(580, 180, 20, 230);
      pg.fillStyle(0x9aa3a8, 1).fillRect(500, slammed ? 360 : 210, 80, 30);
      pg.fillStyle(0x3a2d24, 1).fillRect(470, 390, 140, 20);
      pg.fillStyle(C.brass, 1).fillRect(470, 390, 140, 4);
      if (!slammed) pg.lineStyle(2, 0xff4d2e, 1).lineBetween(505, 245, 520, 255).lineBetween(520, 255, 512, 265);
      keep(this.add.text(540, 140, 'LINE 3', { fontFamily: 'monospace', fontSize: '13px', color: '#ffd43b' }).setOrigin(0.5));

      person('tinker', 220, 450);
      person('boss', 850, 450, 2.2);
      if (slammed) {
        keep(this.add.image(560, 445, 'juno').setScale(2).setAngle(90).setTint(0xffd0c0).setDepth(445));
        for (let i = 0; i < 16; i++) {
          const spark = keep(this.add.circle(540, 380, 3, 0xffd43b).setDepth(500));
          this.tweens.add({
            targets: spark,
            x: 540 + Phaser.Math.Between(-140, 140),
            y: 380 + Phaser.Math.Between(-120, 40),
            alpha: 0, duration: 650, repeat: -1, delay: i * 40,
          });
        }
        this.cameras.main.shake(300, 0.012);
        this.cameras.main.flash(200, 255, 120, 40);
      } else {
        person('juno', 400, 450);
      }
    } else if (key === 'memory') {
      g.fillStyle(0x1c130e, 1).fillRect(0, 0, WIDTH, HEIGHT);
      keep(this.add.image(WIDTH / 2, 300, 'glow').setTint(0xc98a4a).setScale(4.5).setAlpha(0.35));
      person('ren', 430, 400, 2.4).setTint(0xffe6c0);
      person('tinker', 540, 410, 1.6).setTint(0xffe6c0);
      keep(this.add.text(WIDTH / 2, 60, '- years ago -', {
        fontFamily: 'monospace', fontSize: '16px', color: '#b59a6e',
      }).setOrigin(0.5));
    } else if (key === 'night') {
      g.fillStyle(0x07080e, 1).fillRect(0, 0, WIDTH, HEIGHT);
      for (let i = 0; i < 50; i++) {
        g.fillStyle(0xfff3d6, Math.random() * 0.6 + 0.2).fillCircle(Math.random() * WIDTH, Math.random() * 220, Math.random() * 1.3 + 0.3);
      }
      g.fillStyle(0xf3e6c4, 1).fillCircle(830, 90, 34);
      g.fillStyle(0x07080e, 1).fillCircle(845, 82, 30);
      // Factory silhouette
      g.fillStyle(0x15110e, 1).fillRect(200, 190, 560, 280);
      g.fillRect(260, 80, 40, 110).fillRect(380, 110, 40, 80).fillRect(620, 100, 36, 90);
      for (let i = 0; i < 6; i++) {
        keep(this.add.image(260 + i * 85, 275, 'glow').setTint(C.fire).setBlendMode('ADD').setScale(0.7).setAlpha(0.5));
        g.fillStyle(0xff8c1a, 0.9).fillRect(240 + i * 85, 260, 40, 30);
        g.fillStyle(0x15110e, 1).fillRect(258 + i * 85, 260, 4, 30);
      }
      g.fillStyle(0x0d0a08, 1).fillRect(0, 470, WIDTH, 170);
      for (const cx of [280, 400, 638]) {
        keep(this.add.particles(cx, cx === 280 ? 80 : cx === 400 ? 110 : 100, 'puff', {
          lifespan: 3000, speedX: { min: 5, max: 20 }, speedY: { min: -25, max: -12 },
          scale: { start: 0.4, end: 1.6 }, alpha: { start: 0.25, end: 0 }, tint: 0x9a8f80, frequency: 250,
        }));
      }
      person('tinker', 130, 455, 1.2);
    }
  }
}

// ---------------------------------------------------------------------------
// The sneaking (and wrench-swinging) mission
// ---------------------------------------------------------------------------

class FactoryScene extends Phaser.Scene {
  constructor() { super('Factory'); }

  create() {
    this.gameOver = false;
    this.won = false;
    this.sabotagedCount = 0;
    this.hp = PLAYER_MAX_HP;
    this.hpTween = null; // the scene object survives restarts; drop the old scene's tween
    this.weapon = WEAPONS.wrench;
    this.invulnUntil = 0;
    this.knockUntil = 0;
    this.swingReadyAt = 0;
    this.swingStart = -9999;
    this.facingRight = true;

    this.cameras.main.fadeIn(400, 0, 0, 0);
    this.buildLevel();
    this.buildFurnaces();
    this.buildPlayer();
    this.buildGuards();
    this.buildAtmosphere();
    this.buildHud();

    this.cursors = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys('W,A,S,D,E,R');
  }

  // --- Setup -----------------------------------------------------------------

  buildLevel() {
    this.add.tileSprite(0, 0, WIDTH, HEIGHT, 'plate').setOrigin(0).setDepth(0);

    const g = this.add.graphics().setDepth(1);
    // Floor details: oil stains and drain grates
    for (const [x, y, w, h] of [[150, 300, 60, 26], [620, 520, 48, 20], [820, 330, 40, 18], [400, 80, 50, 22]]) {
      g.fillStyle(0x0c0907, 0.6).fillEllipse(x, y, w, h);
    }
    for (const [x, y] of [[110, 470], [490, 250], [820, 420]]) {
      g.fillStyle(0x0c0907, 1).fillRect(x - 14, y - 14, 28, 28);
      g.lineStyle(2, 0x4d3d2c, 1).strokeRect(x - 14, y - 14, 28, 28);
      for (let i = -8; i <= 8; i += 6) g.lineBetween(x + i, y - 12, x + i, y + 12);
    }

    // Walls and crates (solid, block vision)
    this.blockers = [];
    this.wallGroup = this.physics.add.staticGroup();
    for (const w of WALLS) {
      if (w.crate) this.drawCrate(g, w);
      else this.drawWall(g, w);
      const solid = this.add.rectangle(w.x + w.w / 2, w.y + w.h / 2, w.w, w.h).setVisible(false);
      this.wallGroup.add(solid);
      this.blockers.push(new Phaser.Geom.Rectangle(w.x, w.y, w.w, w.h));
    }
    for (const [x, y] of [[210, 110], [710, 110], [450, 160], [210, 520], [710, 500], [530, 480]]) drawGauge(g, x, y);
  }

  drawWall(g, w) {
    g.fillStyle(C.wallDark, 1).fillRect(w.x, w.y, w.w, w.h);
    g.fillStyle(C.wall, 1).fillRect(w.x + 2, w.y + 2, w.w - 4, w.h - 4);
    g.lineStyle(1, 0x5c4632, 1).strokeRect(w.x + 0.5, w.y + 0.5, w.w - 1, w.h - 1);
    const horiz = w.w >= w.h;
    g.fillStyle(C.rivet, 1);
    if (horiz) {
      for (let x = w.x + 6; x < w.x + w.w - 3; x += 16) g.fillCircle(x, w.y + 3.5, 1.3).fillCircle(x, w.y + w.h - 3.5, 1.3);
      drawPipe(g, w.x, w.y + w.h / 2, w.x + w.w, w.y + w.h / 2);
    } else {
      for (let y = w.y + 6; y < w.y + w.h - 3; y += 16) g.fillCircle(w.x + 3.5, y, 1.3).fillCircle(w.x + w.w - 3.5, y, 1.3);
      drawPipe(g, w.x + w.w / 2, w.y, w.x + w.w / 2, w.y + w.h);
    }
  }

  drawCrate(g, w) {
    g.fillStyle(0x000000, 0.35).fillRect(w.x + 4, w.y + 6, w.w, w.h);
    g.fillStyle(0x5e3f22, 1).fillRect(w.x, w.y, w.w, w.h);
    g.lineStyle(2, 0x45301a, 1);
    for (let y = w.y + 15; y < w.y + w.h; y += 15) g.lineBetween(w.x, y, w.x + w.w, y);
    g.lineStyle(5, 0x7a5532, 1).lineBetween(w.x + 4, w.y + 4, w.x + w.w - 4, w.y + w.h - 4);
    g.lineStyle(3, 0x3a2614, 1).strokeRect(w.x, w.y, w.w, w.h);
    for (const [cx, cy] of [[w.x, w.y], [w.x + w.w - 9, w.y], [w.x, w.y + w.h - 9], [w.x + w.w - 9, w.y + w.h - 9]]) {
      g.fillStyle(C.brass, 1).fillRect(cx, cy, 9, 9);
      g.fillStyle(C.brassDark, 1).fillCircle(cx + 4.5, cy + 4.5, 1.5);
    }
  }

  buildFurnaces() {
    this.furnaces = FURNACES.map((f) => {
      const baseY = f.y + 22;
      const glow = this.add.image(f.x, f.y, 'glow').setTint(C.fire).setBlendMode('ADD')
        .setScale(1.8).setAlpha(0.55).setDepth(2);
      const sprite = this.add.image(f.x, baseY, 'furnace').setOrigin(0.5, 1).setDepth(baseY);
      const flame = this.add.image(f.x, f.y + 12, 'flame').setOrigin(0.5, 1).setScale(0.75).setDepth(baseY + 0.5);

      const solid = this.add.rectangle(f.x, f.y, 40, 40).setVisible(false);
      this.wallGroup.add(solid);
      this.blockers.push(new Phaser.Geom.Rectangle(f.x - 20, f.y - 20, 40, 40));
      return { x: f.x, y: f.y, glow, sprite, flame, sabotaged: false };
    });
  }

  buildPlayer() {
    this.player = this.physics.add.image(PLAYER_START.x, PLAYER_START.y, 'tinker')
      .setOrigin(0.5, FEET_Y / CHAR_H);
    this.player.body.setCircle(PLAYER_RADIUS, CHAR_W / 2 - PLAYER_RADIUS, FEET_Y - PLAYER_RADIUS);
    this.player.body.setCollideWorldBounds(true);
    this.physics.add.collider(this.player, this.wallGroup);
    this.wrench = this.add.image(0, 0, 'wrench').setOrigin(0.05, 0.5);
    // Faint warm light so Tinker stays readable in dark corners
    this.playerLight = this.add.image(0, 0, 'glow').setTint(0xffd8a0).setBlendMode('ADD')
      .setScale(1.1).setAlpha(0.22).setDepth(2);
  }

  buildGuards() {
    this.coneGfx = this.add.graphics().setDepth(3).setBlendMode('ADD');
    this.guards = GUARDS.map((def) => {
      const start = def.waypoints[0];
      const next = def.waypoints[1];
      const sprite = this.physics.add.image(start.x, start.y, 'guard').setOrigin(0.5, FEET_Y / CHAR_H);
      sprite.body.setCircle(GUARD_RADIUS, CHAR_W / 2 - GUARD_RADIUS, FEET_Y - GUARD_RADIUS);
      const lantern = this.add.image(start.x, start.y, 'glow').setTint(0xffb347).setBlendMode('ADD')
        .setScale(0.9).setAlpha(0.5).setDepth(2);
      const icon = this.add.text(start.x, start.y, '', {
        fontFamily: 'monospace', fontSize: '22px', fontStyle: 'bold', color: '#ffd43b',
        stroke: '#1a0e08', strokeThickness: 4,
      }).setOrigin(0.5).setDepth(1900);
      return {
        sprite, lantern, icon,
        waypoints: def.waypoints,
        target: 1,
        facing: Phaser.Math.Angle.Between(start.x, start.y, next.x, next.y),
        state: 'patrol',     // patrol | chase | search | return | ko
        hp: GUARD_MAX_HP,
        wait: 0, stagger: 0, windup: 0, attackCooldown: 0,
        trail: [], lastSeen: null, searchTime: 0, lookTime: 0, stuck: 0,
      };
    });
    this.physics.add.collider(this.guards.map((g) => g.sprite), this.wallGroup);
    this.guardBars = this.add.graphics().setDepth(1900);
  }

  buildAtmosphere() {
    // Drifting steam across the whole floor
    this.add.particles(0, 0, 'puff', {
      emitZone: { type: 'random', source: new Phaser.Geom.Rectangle(0, 0, WIDTH, HEIGHT) },
      lifespan: 7000, speedX: { min: 4, max: 14 }, speedY: { min: -8, max: -2 },
      scale: { start: 1.2, end: 3 }, alpha: { start: 0, end: 0.07, ease: 'Sine.easeInOut' },
      tint: 0xd8c8b0, frequency: 350,
    }).setDepth(1500);
    // Hissing pipe vents
    for (const v of STEAM_VENTS) {
      this.add.particles(v.x, v.y, 'puff', {
        lifespan: 1600, speedX: { min: -15, max: 15 }, speedY: { min: -30, max: -10 },
        scale: { start: 0.15, end: 0.9 }, alpha: { start: 0.35, end: 0 },
        tint: 0xe8dccb, frequency: 160,
      }).setDepth(1500);
    }
    // Night shadows around the edges
    this.add.image(0, 0, 'vignette').setOrigin(0).setDepth(1800);
  }

  buildHud() {
    this.add.rectangle(WIDTH / 2, 17, WIDTH, 34, 0x140e0a, 0.85).setDepth(2000);
    this.add.rectangle(WIDTH / 2, 34, WIDTH, 2, 0xb5893a).setDepth(2000);
    // Health gauge: clockwork heart + glass tube (empty tube underneath, full tube cropped on top)
    this.hpEmpty = this.add.image(8, 3, 'hpbar_empty', 0).setOrigin(0).setDepth(2001);
    this.hpFull = this.add.image(8, 3, 'hpbar_full', 0).setOrigin(0).setDepth(2002);
    this.hpText = this.add.text(138, 17, '', {
      fontFamily: 'monospace', fontSize: '14px', fontStyle: 'bold', color: '#fff3d6',
      stroke: '#1a0e08', strokeThickness: 3,
    }).setOrigin(0, 0.5).setDepth(2002);
    this.hpShown = this.hp;
    this.drawHpBar(this.hp);
    const style = { fontFamily: 'monospace', fontSize: '16px', color: '#e2bd55' };
    this.hud = this.add.text(200, 17, '', style).setOrigin(0, 0.5).setDepth(2001);
    this.add.text(WIDTH - 20, 17, 'Move: WASD/Arrows   Swing: Space   Sabotage: E',
      { ...style, fontSize: '13px', color: '#a8916a' }).setOrigin(1, 0.5).setDepth(2001);
    this.prompt = this.add.text(0, 0, '[E] Sabotage', {
      fontFamily: 'monospace', fontSize: '13px', color: '#fff3bf',
      backgroundColor: '#1a0e08cc', padding: { x: 4, y: 2 },
    }).setOrigin(0.5).setDepth(2001).setVisible(false);
    this.banner = this.add.text(WIDTH / 2, HEIGHT / 2, '', {
      fontFamily: 'monospace', fontSize: '34px', color: '#ffffff', align: 'center',
      backgroundColor: '#140e0ae6', padding: { x: 24, y: 16 },
    }).setOrigin(0.5).setDepth(2100).setVisible(false);
    this.updateHud();
  }

  // --- Main loop -------------------------------------------------------------

  update(time, delta) {
    const dt = delta / 1000;
    this.flickerFurnaces();
    this.animateHeart(time);

    if (this.won) {
      if (Phaser.Input.Keyboard.JustDown(this.keys.R)) this.scene.restart();
      this.updateVisuals(time);
      return;
    }
    if (this.gameOver) return;

    this.handlePlayerMovement(time);
    this.handleSwing(time);
    this.updateGuards(dt, time);
    this.drawCones();
    this.updateVisuals(time);
    this.handleSabotage();
  }

  handlePlayerMovement(time) {
    if (time < this.knockUntil) return; // being knocked back
    let vx = 0, vy = 0;
    if (this.cursors.left.isDown || this.keys.A.isDown) vx -= 1;
    if (this.cursors.right.isDown || this.keys.D.isDown) vx += 1;
    if (this.cursors.up.isDown || this.keys.W.isDown) vy -= 1;
    if (this.cursors.down.isDown || this.keys.S.isDown) vy += 1;
    if (vx !== 0) this.facingRight = vx > 0;
    const v = new Phaser.Math.Vector2(vx, vy).normalize().scale(PLAYER_SPEED);
    this.player.body.setVelocity(v.x, v.y);
  }

  // --- Combat ----------------------------------------------------------------

  handleSwing(time) {
    if (!Phaser.Input.Keyboard.JustDown(this.cursors.space) || time < this.swingReadyAt) return;
    this.swingReadyAt = time + this.weapon.cooldownMs;
    this.swingStart = time;

    const p = this.player;
    let target = null, best = this.weapon.range;
    for (const g of this.guards) {
      if (g.state === 'ko') continue;
      const d = Phaser.Math.Distance.Between(p.x, p.y, g.sprite.x, g.sprite.y);
      if (d <= best) { best = d; target = g; }
    }
    if (target) {
      this.facingRight = target.sprite.x >= p.x;
      this.hitGuard(target);
    }
  }

  hitGuard(g) {
    const s = g.sprite, p = this.player;
    const angleFromGuard = Phaser.Math.Angle.Between(s.x, s.y, p.x, p.y);
    const unaware = g.state === 'patrol' || g.state === 'return';
    const behind = Math.abs(Phaser.Math.Angle.Wrap(angleFromGuard - g.facing)) > SNEAK_ANGLE;

    const weapon = this.weapon;
    const weaponClass = WEAPON_CLASSES[weapon.weaponClass];
    const sneak = unaware && behind;
    const rolled = Phaser.Math.Between(weapon.damage.min, weapon.damage.max);
    const damage = rolled * (sneak ? SNEAK_ATTACK_MULTIPLIER : 1);
    const luckyKo = Math.random() < (weaponClass.instantKoChance || 0);

    this.sparks((s.x + p.x) / 2, (s.y + p.y) / 2 - 20);
    this.cameras.main.shake(sneak || luckyKo ? 140 : 90, sneak || luckyKo ? 0.008 : 0.005);

    if (luckyKo) {
      g.hp = 0;
      this.floatText(s.x, s.y - 78, 'LUCKY KNOCKOUT!', '#ffd43b');
    } else {
      g.hp = Math.max(0, g.hp - damage);
      if (sneak) this.floatText(s.x, s.y - 78, `SNEAK ATTACK! -${damage}`, '#ffd43b');
      else this.floatText(s.x, s.y - 78, `CLANG! -${damage}`, '#ffffff');
    }

    if (g.hp <= 0) return this.knockOut(g);

    // Survived: stagger, get knocked back, and turn on Tinker
    g.stagger = 0.45;
    g.windup = 0;
    g.facing = angleFromGuard;
    s.setTint(0xff7766);
    this.time.delayedCall(150, () => { if (g.state !== 'ko') s.clearTint(); });
    s.body.setVelocity(-Math.cos(angleFromGuard) * 220, -Math.sin(angleFromGuard) * 220);
    this.spot(g);
  }

  knockOut(g) {
    const s = g.sprite;
    g.state = 'ko';
    s.body.setVelocity(0, 0);
    s.body.enable = false;
    s.setTint(0x8a8a8a).setDepth(s.y - 10);
    this.tweens.add({ targets: s, angle: 90, duration: 250, ease: 'Back.easeOut' });
    g.lantern.setScale(0.5).setAlpha(0.2);
    g.icon.setText('z Z').setColor('#a8a8a8').setFontSize(16);
    this.tweens.add({ targets: g.icon, alpha: 0.3, duration: 700, yoyo: true, repeat: -1 });
    this.floatText(s.x, s.y - 40, 'KNOCKED OUT', '#c9a227');
  }

  hurtPlayer(g) {
    if (this.time.now < this.invulnUntil || this.gameOver) return;
    this.hp = Math.max(0, this.hp - GUARD_DAMAGE);
    this.updateHud();
    this.invulnUntil = this.time.now + INVULN_MS;
    this.knockUntil = this.time.now + 180;

    const p = this.player;
    const a = Phaser.Math.Angle.Between(g.sprite.x, g.sprite.y, p.x, p.y);
    p.body.setVelocity(Math.cos(a) * 280, Math.sin(a) * 280);
    p.setTint(0xff5544);
    this.hpFull.setTint(0xff8a7a);
    this.hpEmpty.setTint(0xff8a7a);
    this.time.delayedCall(160, () => {
      p.clearTint();
      this.hpFull.clearTint();
      this.hpEmpty.clearTint();
    });
    this.cameras.main.shake(160, 0.01);
    this.floatText(p.x, p.y - 56, `-${GUARD_DAMAGE}`, '#ff6b6b');

    if (this.hp <= 0) this.defeated();
  }

  // --- Guard AI --------------------------------------------------------------

  updateGuards(dt) {
    const p = this.player;
    for (const g of this.guards) {
      if (g.state === 'ko') continue;
      const s = g.sprite;
      g.attackCooldown = Math.max(0, g.attackCooldown - dt);

      if (g.stagger > 0) {
        g.stagger -= dt;
        s.body.velocity.scale(0.85);
        continue;
      }

      const dist = Phaser.Math.Distance.Between(s.x, s.y, p.x, p.y);
      const touching = dist < GUARD_RADIUS + PLAYER_RADIUS + 4;

      switch (g.state) {
        case 'patrol':
          this.patrol(g, dt);
          if (touching || this.canSee(g)) this.spot(g);
          break;
        case 'chase':
          this.chase(g, dt, dist);
          break;
        case 'search':
          this.search(g, dt);
          if (touching || this.canSee(g)) this.spot(g);
          break;
        case 'return':
          this.returnToPost(g, dt);
          if (touching || this.canSee(g)) this.spot(g);
          break;
      }
    }
  }

  spot(g) {
    if (g.state !== 'chase') {
      if (g.state === 'patrol') g.trail = [{ x: g.sprite.x, y: g.sprite.y }];
      g.state = 'chase';
      g.icon.setText('!').setColor('#ff4d2e');
      g.icon.setScale(1.8);
      this.tweens.add({ targets: g.icon, scale: 1, duration: 200, ease: 'Back.easeOut' });
    }
    g.lastSeen = { x: this.player.x, y: this.player.y };
  }

  // Walk toward a point; returns true once arrived
  walkTo(g, tx, ty, speed, dt) {
    const s = g.sprite;
    const dist = Phaser.Math.Distance.Between(s.x, s.y, tx, ty);
    if (dist <= Math.max(4, speed * dt)) {
      s.body.reset(tx, ty);
      return true;
    }
    const a = Phaser.Math.Angle.Between(s.x, s.y, tx, ty);
    g.facing = Phaser.Math.Angle.RotateTo(g.facing, a, 6 * dt);
    s.body.setVelocity(Math.cos(a) * speed, Math.sin(a) * speed);
    return false;
  }

  patrol(g, dt) {
    const s = g.sprite;
    if (g.wait > 0) {
      g.wait -= dt;
      s.body.setVelocity(0, 0);
      g.facing += Math.sin(this.time.now / 300) * 0.02; // glance around
      return;
    }
    const wp = g.waypoints[g.target];
    const desired = Phaser.Math.Angle.Between(s.x, s.y, wp.x, wp.y);
    g.facing = Phaser.Math.Angle.RotateTo(g.facing, desired, 3 * dt);
    if (Math.abs(Phaser.Math.Angle.Wrap(desired - g.facing)) > 0.15) {
      s.body.setVelocity(0, 0); // turn before walking
      return;
    }
    if (this.walkTo(g, wp.x, wp.y, GUARD_SPEED, dt)) {
      g.target = (g.target + 1) % g.waypoints.length;
      g.wait = 0.8;
    }
  }

  recordTrail(g) {
    const s = g.sprite;
    const last = g.trail[g.trail.length - 1];
    if (!last || Phaser.Math.Distance.Between(last.x, last.y, s.x, s.y) > 24) g.trail.push({ x: s.x, y: s.y });
  }

  chase(g, dt, dist) {
    const s = g.sprite, p = this.player;
    const visible = dist < VISION_RANGE * 1.5 && this.hasLineOfSight(s.x, s.y, p.x, p.y);
    if (!visible) {
      g.state = 'search';
      g.searchTime = 0;
      g.lookTime = 0;
      g.windup = 0;
      s.clearTint();
      g.icon.setText('?').setColor('#ffd43b');
      return;
    }
    g.lastSeen = { x: p.x, y: p.y };
    this.recordTrail(g);

    const a = Phaser.Math.Angle.Between(s.x, s.y, p.x, p.y);
    g.facing = Phaser.Math.Angle.RotateTo(g.facing, a, 8 * dt);

    // Winding up an attack: stand still, then strike if she's still close
    if (g.windup > 0) {
      s.body.setVelocity(0, 0);
      g.windup -= dt;
      if (g.windup <= 0) {
        s.clearTint();
        g.attackCooldown = GUARD_ATTACK_COOLDOWN;
        this.tweens.add({ targets: s, x: s.x + Math.cos(a) * 8, y: s.y + Math.sin(a) * 8, duration: 70, yoyo: true });
        if (dist <= GUARD_ATTACK_RANGE + 10) this.hurtPlayer(g);
      }
      return;
    }

    if (dist <= GUARD_ATTACK_RANGE) {
      s.body.setVelocity(0, 0);
      if (g.attackCooldown <= 0) {
        g.windup = GUARD_ATTACK_WINDUP;
        s.setTint(0xffa060);
      }
    } else {
      s.body.setVelocity(Math.cos(a) * GUARD_CHASE_SPEED, Math.sin(a) * GUARD_CHASE_SPEED);
    }
  }

  search(g, dt) {
    const s = g.sprite;
    this.recordTrail(g);
    g.searchTime += dt;
    const arrived = Phaser.Math.Distance.Between(s.x, s.y, g.lastSeen.x, g.lastSeen.y) <= 6;
    if (!arrived && g.searchTime < 3) {
      this.walkTo(g, g.lastSeen.x, g.lastSeen.y, GUARD_CHASE_SPEED * 0.8, dt);
      return;
    }
    // Look around, then give up
    s.body.setVelocity(0, 0);
    g.lookTime += dt;
    g.facing += Math.cos(g.lookTime * 3) * 2.5 * dt;
    if (g.lookTime > 1.8) {
      g.state = 'return';
      g.stuck = 0;
      g.icon.setText('');
    }
  }

  // Retrace the steps taken while chasing, back to the patrol route
  returnToPost(g, dt) {
    if (!g.trail.length) {
      g.state = 'patrol';
      return;
    }
    const t = g.trail[g.trail.length - 1];
    if (this.walkTo(g, t.x, t.y, GUARD_SPEED, dt)) {
      g.trail.pop();
      g.stuck = 0;
    } else if ((g.stuck += dt) > 2.5) {
      g.trail.pop();
      g.stuck = 0;
    }
  }

  canSee(g) {
    const s = g.sprite, p = this.player;
    const dist = Phaser.Math.Distance.Between(s.x, s.y, p.x, p.y);
    if (dist > VISION_RANGE + PLAYER_RADIUS) return false;
    const angleTo = Phaser.Math.Angle.Between(s.x, s.y, p.x, p.y);
    if (Math.abs(Phaser.Math.Angle.Wrap(angleTo - g.facing)) > VISION_HALF_ANGLE) return false;
    return this.hasLineOfSight(s.x, s.y, p.x, p.y);
  }

  castRay(x, y, angle, maxLen) {
    const cos = Math.cos(angle), sin = Math.sin(angle);
    for (let d = 0; d < maxLen; d += 4) {
      const px = x + cos * d, py = y + sin * d;
      for (const r of this.blockers) if (r.contains(px, py)) return d;
    }
    return maxLen;
  }

  hasLineOfSight(x1, y1, x2, y2) {
    const line = new Phaser.Geom.Line(x1, y1, x2, y2);
    for (const r of this.blockers) if (Phaser.Geom.Intersects.LineToRectangle(line, r)) return false;
    return true;
  }

  // --- Rendering -------------------------------------------------------------

  drawCones() {
    const cone = this.coneGfx;
    cone.clear();
    for (const g of this.guards) {
      if (g.state === 'ko') continue;
      const s = g.sprite;
      const color = g.state === 'chase' ? 0xff4d2e : g.state === 'search' ? 0xff9a3c : 0xffc66d;
      cone.fillStyle(color, g.state === 'chase' ? 0.22 : 0.15);
      cone.beginPath();
      cone.moveTo(s.x, s.y);
      for (let i = 0; i <= VISION_RAYS; i++) {
        const a = g.facing - VISION_HALF_ANGLE + (i / VISION_RAYS) * VISION_HALF_ANGLE * 2;
        const len = this.castRay(s.x, s.y, a, VISION_RANGE);
        cone.lineTo(s.x + Math.cos(a) * len, s.y + Math.sin(a) * len);
      }
      cone.closePath();
      cone.fillPath();
    }
  }

  updateVisuals(time) {
    const p = this.player;
    p.setDepth(p.y).setFlipX(!this.facingRight);
    this.playerLight.setPosition(p.x, p.y - 12);
    p.setAlpha(time < this.invulnUntil ? (Math.floor(time / 80) % 2 ? 0.35 : 1) : 1);

    // Wrench: resting over the shoulder, swings down on Space
    const e = time - this.swingStart;
    const swing = e < 110 ? e / 110 : e < 320 ? 1 - (e - 110) / 210 : 0;
    const deg = -70 + swing * 150;
    const side = this.facingRight ? 1 : -1;
    this.wrench.setPosition(p.x + side * 12, p.y - 6)
      .setAngle(this.facingRight ? deg : 180 - deg)
      .setFlipY(!this.facingRight)
      .setDepth(p.y + 1)
      .setAlpha(p.alpha);

    this.guardBars.clear();
    for (const g of this.guards) {
      const s = g.sprite;
      if (g.state === 'ko') {
        g.icon.setPosition(s.x + 18, s.y - 30);
        continue;
      }
      // Small health bar over a hurt guard
      const hurt = g.hp < GUARD_MAX_HP;
      if (hurt) {
        const pct = g.hp / GUARD_MAX_HP;
        this.guardBars.fillStyle(0x1a0e08, 1).fillRect(s.x - 17, s.y - 67, 34, 6);
        this.guardBars.fillStyle(pct > 0.6 ? 0x7fbf5a : pct > 0.3 ? 0xe0a030 : 0xe8553d, 1)
          .fillRect(s.x - 16, s.y - 66, 32 * pct, 4);
        this.guardBars.lineStyle(1, C.brass, 1).strokeRect(s.x - 17, s.y - 67, 34, 6);
      }
      g.icon.setPosition(s.x, s.y - (hurt ? 80 : 62));
      s.setDepth(s.y);
      const c = Math.cos(g.facing);
      if (c < -0.2) s.setFlipX(true);
      else if (c > 0.2) s.setFlipX(false);
      g.lantern.setPosition(s.x + (s.flipX ? -16 : 16), s.y + 3).setAlpha(0.42 + Math.random() * 0.1);
    }
  }

  flickerFurnaces() {
    for (const f of this.furnaces) {
      if (f.sabotaged) continue;
      f.flame.setScale(0.7 + Math.random() * 0.08, 0.65 + Math.random() * 0.2);
      f.flame.setAlpha(0.85 + Math.random() * 0.15);
      f.glow.setAlpha(0.45 + Math.random() * 0.15);
    }
  }

  sparks(x, y) {
    for (let i = 0; i < 8; i++) {
      const s = this.add.circle(x, y, 2.5, i % 2 ? 0xffd43b : 0xff9a3c).setDepth(1950);
      this.tweens.add({
        targets: s, x: x + Phaser.Math.Between(-30, 30), y: y + Phaser.Math.Between(-30, 20),
        alpha: 0, duration: 300, onComplete: () => s.destroy(),
      });
    }
  }

  floatText(x, y, text, color) {
    const t = this.add.text(x, y, text, {
      fontFamily: 'monospace', fontSize: '15px', fontStyle: 'bold', color,
      stroke: '#1a0e08', strokeThickness: 4,
    }).setOrigin(0.5).setDepth(1960);
    this.tweens.add({ targets: t, y: y - 26, alpha: 0, duration: 900, onComplete: () => t.destroy() });
  }

  // --- Furnaces --------------------------------------------------------------

  handleSabotage() {
    const p = this.player;
    const near = this.furnaces.find((f) =>
      !f.sabotaged && Phaser.Math.Distance.Between(p.x, p.y, f.x, f.y) < SABOTAGE_DISTANCE);

    if (near) {
      this.prompt.setPosition(near.x, near.y - 62).setVisible(true);
      if (Phaser.Input.Keyboard.JustDown(this.keys.E)) this.sabotage(near);
    } else {
      this.prompt.setVisible(false);
    }
  }

  sabotage(f) {
    f.sabotaged = true;
    f.flame.setVisible(false);
    f.glow.setVisible(false);
    f.sprite.setTint(0x6a6a6a);
    this.prompt.setVisible(false);
    this.cameras.main.shake(120, 0.004);

    // A last hiss of smoke as the fire dies
    const smoke = this.add.particles(f.x, f.y - 10, 'puff', {
      lifespan: 1400, speed: { min: 20, max: 60 }, angle: { min: 230, max: 310 },
      scale: { start: 0.3, end: 1.2 }, alpha: { start: 0.5, end: 0 }, tint: 0x8a8580, emitting: false,
    }).setDepth(1600);
    smoke.explode(16);
    this.time.delayedCall(1600, () => smoke.destroy());

    this.sabotagedCount++;
    this.updateHud();
    if (this.sabotagedCount === this.furnaces.length) this.winLevel();
  }

  // --- Outcomes --------------------------------------------------------------

  stopEveryone() {
    this.player.body.setVelocity(0, 0);
    this.prompt.setVisible(false);
    for (const g of this.guards) {
      if (g.state === 'ko') continue;
      g.sprite.body.setVelocity(0, 0);
      g.sprite.clearTint();
    }
  }

  defeated() {
    this.gameOver = true;
    this.stopEveryone();
    this.player.setAlpha(1).setTint(0x9a6a6a);
    this.tweens.add({ targets: [this.player, this.wrench], angle: '+=90', duration: 300 });
    this.cameras.main.flash(250, 255, 40, 40);
    this.banner.setText('TINKER IS DOWN!\nRestarting...').setColor('#ff6b6b').setVisible(true);
    this.time.delayedCall(1600, () => this.scene.restart());
  }

  winLevel() {
    this.won = true;
    this.stopEveryone();
    this.coneGfx.clear();
    this.banner
      .setText('ALL FURNACES SABOTAGED!\nTinker escapes into the night.\n\nPress R to play again')
      .setFontSize(28)
      .setColor('#e2bd55')
      .setVisible(true);
    this.add.text(WIDTH / 2, HEIGHT - 28, 'Health bar art: "Steampunk HP Bars" by mental.bloxx', {
      fontFamily: 'monospace', fontSize: '12px', color: '#a8916a',
      backgroundColor: '#140e0acc', padding: { x: 6, y: 3 },
    }).setOrigin(0.5).setDepth(2100);
  }

  // Reveal the full tube up to the current health; the empty tube shows through beyond it
  drawHpBar(value) {
    const pct = Phaser.Math.Clamp(value / PLAYER_MAX_HP, 0, 1);
    const { w, h, liquidStart, liquidEnd } = HPBAR_FRAME;
    const cropW = pct <= 0 ? 0 : pct >= 1 ? w : liquidStart + Math.round((liquidEnd - liquidStart) * pct);
    this.hpFull.setCrop(0, 0, cropW, h);
  }

  // Tick the heart's clockwork; it races when health is low
  animateHeart(time) {
    const frame = Math.floor(time / (this.hp <= 30 ? 70 : 140)) % HPBAR_FRAME.count;
    this.hpEmpty.setFrame(frame);
    this.hpFull.setFrame(frame);
  }

  updateHud() {
    // Animate the bar down to the new value
    if (this.hpTween) this.hpTween.stop();
    this.hpTween = this.tweens.addCounter({
      from: this.hpShown, to: this.hp, duration: 300, ease: 'Quad.easeOut',
      onUpdate: (tw) => { this.hpShown = tw.getValue(); this.drawHpBar(this.hpShown); },
    });
    this.hpText.setText(`${this.hp}`).setColor(this.hp <= 30 ? '#ff6b5a' : '#fff3d6');
    this.hud.setText(`Furnaces sabotaged: ${this.sabotagedCount} / ${this.furnaces.length}`);
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: WIDTH,
  height: HEIGHT,
  backgroundColor: '#140e0a',
  physics: { default: 'arcade', arcade: { debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [BootScene, PrologueScene, StoryScene, FactoryScene],
});
</script>
</body>
</html>
